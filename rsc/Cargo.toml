[package]
name = "rsc"
version = "0.1.0"
edition = "2024"
description = "A terminal SoundCloud client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Phenixis/rsc"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util", "fs", "signal"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
