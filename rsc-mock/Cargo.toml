[package]
name = "rsc-mock"
version = "0.1.0"
edition = "2024"
description = "A faithful fake of the SoundCloud API, for developing and testing rsc without credentials"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Phenixis/rsc"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1"] }
base64 = "0.22"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["net", "rt", "time"] }
url = "2.5.8"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
